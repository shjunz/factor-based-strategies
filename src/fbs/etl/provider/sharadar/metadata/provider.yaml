# Sharadar 数据供应商的基本信息：只放名字和约定，不放任何密钥。
# 密钥的值：本地放仓库根目录 .env（不 commit）；生产放 AWS Secrets Manager，
# 作为同名环境变量注入 ECS 任务。代码只按 api_key_env 这个名字读环境变量。

provider: sharadar                       # 小写，用于目录名和文件名
vendor: Nasdaq Data Link                 # 数据从哪个平台来
api: SHARADAR/{dataset}                  # datatables 代码，{dataset} 换成表名，例 SHARADAR/SEP
api_key_env: NASDAQ_DATA_LINK_API_KEY    # 环境变量的名字，不是 key 本身
extractor: fbs.etl.provider.sharadar.extract      # 下载和读取代码

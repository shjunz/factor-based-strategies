[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fbs"
version = "0.1.0"
description = "Factor-based strategies research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
    "nasdaq-data-link",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
live = [            # paper trading runner (src/fbs/live): pip install -e ".[live]"
    "alpaca-py",
    "pyyaml",
    "matplotlib",   # dry-run PDF report (src/fbs/live/report.py)
]

[tool.setuptools.packages.find]
where = ["src"]

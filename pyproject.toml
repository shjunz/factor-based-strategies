[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fbs"
version = "0.1.0"
description = "Factor-based strategies research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
    "numba",
    "nasdaq-data-link",
    "exchange-calendars",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pyyaml",       # src/fbs/etl/provider/{provider}/metadata/provider.yaml, strategy config.yaml
]

[project.optional-dependencies]
dev = ["pytest"]
live = [            # paper trading runner (src/fbs/live): uv sync --extra live
    "alpaca-py",
    "ib_async",     # IBKR via TWS / IB Gateway (src/fbs/live/brokers/ibkr.py)
    "matplotlib",   # dry-run PDF report (src/fbs/live/report.py)
]

[tool.setuptools.packages.find]
where = ["src"]

# Ship each data provider's metadata (field_map.csv, vendor dictionary, provider.yaml) with the package
[tool.setuptools.package-data]
"fbs.etl" = ["*/metadata/*.csv", "*/metadata/*.yaml"]

[tool.uv]
# Use the CPython that uv downloads and manages, not a system or Anaconda Python,
# so every researcher runs the same interpreter build
python-preference = "only-managed"

# Alpaca paper trading settings. Changes need one QD and one QR review.

enabled: false                     # keep false until the dry runs look right
mode: paper                        # the only accepted value
account: STRATEGY_TEMPLATE         # TODO: one Alpaca paper account per strategy
capital: 100000                    # TODO: USD this strategy trades with; <= paper account equity
moc_cutoff_minutes: 15

limits:                            # TODO: set from the backtest's own turnover and concentration, plus headroom
  max_gross: 1.0
  max_net: 1.0
  max_weight: 0.10
  max_turnover: 1.0
  max_order_notional: 15000
  max_orders: 50
  min_order_notional: 50
  allow_shorts: false

# Alpaca paper trading settings for strategy_example. Changes need one QD and one QR review.

enabled: false              # set to true only after the dry runs look right
mode: paper                 # the only accepted value; real-money trading is not supported
account: STRATEGY_EXAMPLE   # keys: ALPACA_STRATEGY_EXAMPLE_KEY / ALPACA_STRATEGY_EXAMPLE_SECRET
capital: 100000             # USD this strategy trades with; must be <= the paper account's equity
moc_cutoff_minutes: 15      # refuse to submit market-on-close orders this close to the close

limits:                     # any breach blocks the run: no orders are sent
  max_gross: 1.0            # sum of |weights|
  max_net: 1.0              # |sum of weights|
  max_weight: 0.10          # largest single position
  max_turnover: 1.0         # one-way traded value / capital, per rebalance
  max_order_notional: 15000 # largest single order in USD
  max_orders: 40
  min_order_notional: 50    # smaller adjustments are skipped
  allow_shorts: false
